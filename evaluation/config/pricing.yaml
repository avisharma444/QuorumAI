# Model pricing for cost ESTIMATES (USD per million tokens).
#
# Only verified entries are used; each cites its source and check date.
# Unverified or missing models are reported as "cost unmeasured".
# Real-model runs refuse to start unless every configured model is here.
#
# These are the HIGHEST per-provider OpenRouter prices for each model on
# 2026-10-27 (OpenRouter may route a model to any of several upstream
# providers), so estimates and budget checks are upper bounds. Observed
# charges come from OpenRouter's usage.cost in each response.
models:
  - model: "openai/gpt-4.1-nano"
    input_usd_per_mtok: 0.11
    output_usd_per_mtok: 0.44
    source: "https://openrouter.ai/api/v1/models/openai/gpt-4.1-nano/endpoints"
    effective_date: "2026-10-27"
    verified: true
