# Fixed project name: network (councilai-reproduced_default) and volume names
# stay the same whatever the checkout folder is called.
name: councilai-reproduced

services:
  # Internal only: no host port. The RAG service has no authentication of
  # its own, so it must only be reachable from the Go backend (which checks
  # document access) on the Docker network.
  python-rag:
    build:
      context: ./python-rag
      target: runtime
    volumes:
      - chroma-data:/data/chroma_db
      - hf-models:/models
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Tracing is off unless OTEL_TRACES_EXPORTER=otlp (see the tracing profile).
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    # Ready only after the embedding model, reranker and Chroma store load
    # (the first start downloads the weights into hf-models).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  # Redis Stack (Redis + RediSearch vector search) for the L1 exact cache,
  # L2 semantic cache and document summaries. Reachable only inside the
  # Docker network. Unlike the reference (--save ""), RDB snapshots are on
  # so the redis-data volume actually survives Redis restarts.
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    # redis-server runs as PID 1 (not via the image's bash wrapper, which
    # does not forward SIGTERM: Docker then SIGKILLed Redis and the final
    # snapshot was never written). Only the RediSearch module is needed.
    # AOF (fsync every second) + RDB: conversation memory is user data.
    command: ["/opt/redis-stack/bin/redis-server",
              "--protected-mode", "no",
              "--loadmodule", "/opt/redis-stack/lib/rediscompat.so",
              "--loadmodule", "/opt/redis-stack/lib/redisearch.so", "MAXSEARCHRESULTS", "10000", "MAXAGGREGATERESULTS", "10000",
              "--maxmemory", "${REDIS_MAXMEMORY:-512mb}",
              "--maxmemory-policy", "volatile-lru",
              "--save", "300 1", "--save", "60 100",
              "--appendonly", "yes", "--appendfsync", "everysec",
              "--dir", "/data"]
    stop_grace_period: 30s
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgreSQL: users and document ownership. Internal only (no host port).
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-councilai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-councilai}
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=64MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    mem_limit: 256m

  go-backend:
    build: ./go-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RAG_SERVICE_URL=http://python-rag:8000
      - REDIS_ADDR=redis:6379
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-councilai}
      - DB_NAME=${POSTGRES_DB:-councilai}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-false}
      - METRICS_ADDR=:9464   # Prometheus endpoint, internal network only (no host port)
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      python-rag:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://go-backend:8080
    depends_on:
      - go-backend

  # ── Observability (optional): docker compose --profile observability up -d
  # Prometheus scrapes go-backend:9464 every 15 s. UI on 127.0.0.1:9091 only.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    depends_on:
      - go-backend

  # Grafana with the provisioned Prometheus data source and CouncilAI
  # dashboard. Admin password from .env (GRAFANA_ADMIN_PASSWORD); Grafana
  # refuses to start without it instead of falling back to admin/admin.
  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'GRAFANA_ADMIN_PASSWORD is not set in .env' >&2; exit 1; }; exec /run.sh"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-councilai-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/councilai.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    depends_on:
      - prometheus

  # ── Tracing (optional): OTEL_TRACES_EXPORTER=otlp docker compose --profile tracing up -d
  # Jaeger all-in-one receives OTLP/HTTP on 4318 (internal) and keeps traces
  # in memory (bounded). UI on 127.0.0.1:16686 only.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=5000
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 256m

volumes:
  chroma-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  # Shared with the test image so model weights are downloaded only once.
  hf-models:
    name: councilai-hf
