services:
  python-rag:
    build:
      context: ./python-rag
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data/chroma_db
      - hf-models:/models
      - ./config.yaml:/app/config.yaml:ro
    # Ready only after the embedding model, reranker and Chroma store load
    # (the first start downloads the weights into hf-models).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  go-backend:
    build: ./go-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RAG_SERVICE_URL=http://python-rag:8000
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      python-rag:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://go-backend:8080
    depends_on:
      - go-backend

volumes:
  chroma-data:
  # Shared with the test image so model weights are downloaded only once.
  hf-models:
    name: councilai-hf
