# CouncilAI reproduction configuration (same structure as the reference
# config.yaml, limited to the sections implemented so far).
# Secrets (JWT_SECRET, DB_PASSWORD/POSTGRES_PASSWORD, API keys) are never
# read from this file.
# API keys are NOT read from this file. Set them as environment variables:
#   GEMINI_API_KEY, OPENROUTER_API_KEY, NVIDIA_NIM_API_KEY
# Every setting below can also be overridden by an environment variable, e.g.
# COUNCIL_1_PROVIDER / COUNCIL_1_MODEL, CHAIRMAN_PROVIDER, STAGE_TIMEOUT.

server:
  port: "8080"
  # L2 semantic cache: minimum cosine similarity (1 - distance) for a hit.
  # Reference default. See README "Semantic cache threshold" for measured
  # false-positive rates before changing it.
  semantic_cache_threshold: 0.85
  # JWT_SECRET is required and comes only from the environment (never this file).
  jwt_expiration: "24h"
  # Browser origins allowed to call the API (CORS). Empty = CORS off; the
  # Streamlit UI calls the API server-side and needs none. "*" is rejected.
  cors_allowed_origins: []
  rate_limit:
    rps: 10              # per authenticated user (reference value)
    burst: 20            # reference value; now actually enforced
    auth_rps: 0.2        # register/login per client IP: one every 5 s ...
    auth_burst: 10       # ... after a burst of 10
    # What happens when Redis cannot be reached: "closed" answers 503
    # (no unmetered model spending); "open" lets requests through (reference).
    failure_policy: "closed"

# PostgreSQL: users and document ownership. DB_PASSWORD (or DATABASE_URL)
# comes only from the environment; compose sets it from POSTGRES_PASSWORD.
database:
  host: "postgres"
  port: "5432"
  user: "councilai"
  dbname: "councilai"
  sslmode: "disable"     # traffic stays on the internal Docker network
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"

# Redis conversation memory (reference: last 10 exchanges, 24 h).
conversation:
  max_turns: 10
  ttl: "24h"
  history_exchanges: 5   # earlier exchanges included in model prompts

# Redis Stack caches (reference keys). Password comes from REDIS_PASSWORD.
redis:
  enabled: true
  # L2 semantic answer reuse. Off: at threshold 0.85 the benchmark falsely
  # reused 28% of near-miss questions. SEMANTIC_CACHE_ENABLED overrides.
  semantic_cache_enabled: false
  addr: "redis:6379"
  db: 0                  # RediSearch indexes only work in database 0
  op_timeout: "500ms"    # per Redis round trip
  exact_ttl: "1h"        # L1 answers and document summaries
  semantic_ttl: "24h"    # L2 answers
  circuit_breaker_failure_threshold: 3
  circuit_breaker_success_threshold: 2
  circuit_breaker_timeout: "10s"

rag:
  service_url: "http://python-rag:8000"
  # Questions without a document are grounded with DuckDuckGo results via the
  # RAG service's /search endpoint (reference behaviour). WEB_SEARCH_ENABLED overrides.
  web_search: true
  # Python RAG service (reference keys). Weights download once into the
  # hf-models volume; Chroma data lives in the chroma-data volume.
  chroma_db_path: "/data/chroma_db"
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_dimension: 384
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

providers:
  openrouter_url: "https://openrouter.ai/api/v1/chat/completions"
  gemini_url: "https://generativelanguage.googleapis.com/v1beta"
  nvidia_nim_url: "https://integrate.api.nvidia.com/v1/chat/completions"
  vllm_url: "http://vllm-inference:8001/v1/chat/completions"

council:
  size: 3
  slots: # provider: gemini | openrouter | nvidia-nim | local (vLLM)
    - provider: "openrouter"
      model: "openrouter/free"
    - provider: "openrouter"
      model: "openrouter/free"
    - provider: "openrouter"
      model: "openrouter/free"
  chairman:
    provider: "gemini"
    model: "gemini-2.5-flash"
  router: # LLM query router: picks direct / council / council_deep and needs_doc
    provider: "gemini"
    model: "gemini-2.5-flash"
  ingestion: # summarizes each uploaded document's BME sample for the router
    provider: "gemini"
    model: "gemini-2.5-flash"
  timeouts:
    stage: "30s"    # per model call inside a stage
    llm: "120s"     # HTTP client timeout for council members
    request: "120s" # whole query

# Observability. Prometheus metrics are served on an internal-only listener
# (not the public API port); tracing exports nothing unless enabled.
# Environment overrides: METRICS_ADDR, OTEL_TRACES_EXPORTER (noop | stdout |
# otlp), OTEL_EXPORTER_OTLP_ENDPOINT (e.g. jaeger:4318), OTEL_TRACES_SAMPLER_ARG.
observability:
  metrics_addr: ":9464"
  tracing:
    exporter: "noop"
    otlp_endpoint: ""
    sample_ratio: 1.0   # of new root traces; sampled incoming parents are always followed
